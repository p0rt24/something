<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --paper:#F6F3EE;
    --paper-2:#FFFFFF;
    --ink:#14151A;
    --ink-2:#2B2F36;
    --muted:#6F7682;
    --line:#E8E2D9;
    --line-2:#DDE3F0;
    --rule-blue:#2E5BDA;
    --rule-red:#E63946;
    --marker:#FFD23F;
    --marker-2:#FFD23F99;
    --blue-bg:#EDF0FF;
    --focus:#2E5BDA;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter", system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.45;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* paper texture */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:.45;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(46,91,218,.06) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 90%, rgba(230,57,70,.05) 0%, transparent 50%);
  }
  .wrap{max-width:1160px;margin:0 auto;padding:28px 20px 36px;position:relative}
  /* header - тетрадная шапка */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    padding-bottom:18px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
  }
  .masthead-left{flex:1;min-width:260px}
  .eyebrow{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
    display:flex;gap:14px;align-items:center;
  }
  .eyebrow i{
    width:26px;height:1.5px;background:var(--rule-red);display:inline-block;
  }
  .title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px}
  .title-row h1{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:44px;line-height:.95;letter-spacing:-.04em;font-weight:800;
  }
  .title-row h1 em{
    font-family:"Instrument Serif", serif;
    font-weight:400;letter-spacing:-.02em;font-style:italic;
    color:var(--rule-blue);
  }
  .title-meta{
    font-size:13px;color:var(--muted);font-weight:500;
    border-left:1.5px solid var(--line);padding-left:12px;
    line-height:1.35;
  }
  .title-meta strong{color:var(--ink);font-weight:700}
  .masthead-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  .time-badge{
    font-family:"JetBrains Mono", monospace;
    background:var(--ink);color:#fff;
    padding:10px 14px;
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
  }
  .time-badge .date{font-size:12px;letter-spacing:.02em;opacity:.85;font-weight:500;text-transform:capitalize}
  .time-badge .time{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .time-badge .dot{width:6px;height:6px;background:var(--marker);border-radius:50%;box-shadow:0 0 0 4px rgba(255,210,63,.25)}
  .sub-nav{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end
  }
  .sub-nav button{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
    background:#fff;border:1.5px solid var(--ink);
    padding:7px 10px;cursor:pointer;
    transition:transform .1s, background .1s;
  }
  .sub-nav button:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
  .sub-nav button:active{transform:none;box-shadow:none}
  .sub-nav button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media(max-width:820px){
    .masthead{flex-direction:column;align-items:stretch}
    .masthead-right{align-items:stretch}
    .time-badge{justify-content:space-between}
    .title-row h1{font-size:36px}
  }

  /* layout */
  .layout{
    display:grid;
    grid-template-columns:1.45fr .85fr;
    gap:18px;
    align-items:start;
  }
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  /* today sheet - тетрадный лист */
  .today-sheet{
    background:var(--paper-2);
    border:1.5px solid var(--ink);
    position:relative;
    box-shadow:4px 4px 0 var(--ink);
    overflow:hidden;
  }
  /* скрепка */
  .today-sheet::before{
    content:"";
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:92px;height:14px;background:var(--ink);
    border-radius:0 0 6px 6px;
    z-index:3;
  }
  .today-sheet::after{
    content:"";
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:36px;height:8px;background:rgba(255,255,255,.35);border-radius:99px;
    margin-top:3px;z-index:4;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:26px 22px 14px 56px;
    border-bottom:1.5px solid var(--ink);
    position:relative;
  }

  .sheet-head-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sheet-day{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;
  }
  .sheet-day span{
    font-family:"Instrument Serif", serif;
    font-style:italic;font-weight:400;color:var(--rule-blue);
  }
  .sheet-badge{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--marker);border:1.5px solid var(--ink);
    padding:4px 8px;transform:rotate(-1deg);
  }
  .sheet-count{
    font-family:"JetBrains Mono", monospace;
    font-size:12px;color:var(--muted);font-weight:500;
  }
  .sheet-count b{color:var(--ink)}
  /* клетка */
  .sheet-body{
    position:relative;
    padding:14px 18px 18px 56px;
    background:
      linear-gradient(rgba(46,91,218,.11) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,91,218,.11) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px;
    background-position: 0 12px, 0 0;
  }
  /* маркерная подложка за уроками сегодня */
  .lessons-today{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
  .lesson-row{
    display:grid;
    grid-template-columns:32px 28px 1fr auto;
    gap:10px;align-items:center;
    background:rgba(255,255,255,.92);
    border:1.5px solid var(--ink);
    padding:10px 10px;
    position:relative;
  }
  .lesson-row.is-highlight{
    background:var(--marker);
  }
  .lesson-row .lnum{
    font-family:"JetBrains Mono", monospace;
    font-size:12px;font-weight:700;
    width:32px;height:32px;display:grid;place-items:center;
    background:var(--ink);color:#fff;
  }
  .lesson-row.is-highlight .lnum{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .lesson-row .licon{font-size:16px;text-align:center}
  .lesson-name2{
    font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  }
  .lesson-name2 small{
    font-weight:500;color:var(--muted);font-size:12.5px;
    font-family:"JetBrains Mono", monospace;letter-spacing:.02em;
  }
  .lesson-room{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;font-weight:700;letter-spacing:.04em;
    color:var(--muted);border:1px dashed #CBD2DE;padding:4px 6px;background:#fff;
    white-space:nowrap;
  }
  @media(max-width:520px){
    .lesson-row{grid-template-columns:28px 24px 1fr}
    .lesson-room{display:none}
    .sheet-body{padding-left:44px}
    .sheet-head{padding-left:44px}
    .sheet-head::before{left:30px}
  }

  /* stack остальных дней */
  .stack{display:flex;flex-direction:column;gap:12px}
  .stack-label{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
    display:flex;align-items:center;gap:10px;
  }
  .stack-label::after{content:"";flex:1;height:1.5px;background:var(--line)}
  .day-card{
    background:#fff;
    border:1.5px solid var(--ink);
    padding:12px 12px 10px;
    transition:transform .12s, box-shadow .12s;
  }
  .day-card:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
  .day-card-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:10px;padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .day-card-title{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:16px;font-weight:800;letter-spacing:-.02em;
  }
  .day-card-count{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;font-weight:700;
    background:var(--paper);border:1px solid var(--line);padding:3px 6px;color:var(--muted)
  }
  .mini-list{display:flex;flex-direction:column;gap:6px}
  .mini-item{
    display:grid;grid-template-columns:22px 18px 1fr;
    gap:8px;align-items:center;
    font-size:13px;font-weight:500;
    padding:6px 6px;
    border:1px solid transparent;
  }
  .mini-item + .mini-item{border-top:1px solid #F0EDE8}
  .mini-num{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;font-weight:700;color:var(--muted);
    width:22px;height:22px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--paper);
  }
  .mini-icon{font-size:13px}
  /* цветные точки вместо радуги */
  .mini-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle}
  .dot-rus{background:#E63946}
  .dot-math{background:#2E5BDA}
  .dot-read{background:#7C3AED}
  .dot-eng{background:#0E8A6B}
  .dot-logo{background:#C26A00}
  .dot-music{background:#DB2777}
  .dot-def{background:#6B7280}
  .dot-fiz{background:#059669}
  .dot-okm{background:#65A30D}
  .dot-izo{background:#EC4899}
  .dot-trud{background:#92400E}
  .dot-razgovor{background:#DC2626}

  .day-card.is-today-mini{
    background:var(--blue-bg);
    border-color:var(--rule-blue);
  }

  /* footer */
  .footer{
    margin-top:18px;
    display:grid;grid-template-columns:1fr auto;
    gap:14px;align-items:center;
    border-top:1.5px solid var(--ink);
    padding-top:14px;
  }
  .next-line{
    font-size:13px;color:var(--ink-2);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .next-kicker{
    font-family:"JetBrains Mono", monospace;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--ink);color:#fff;padding:4px 7px;
  }
  .next-line b{font-weight:700}
  .footer-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn2{
    font-family:"JetBrains Mono", monospace;
    font-size:12px;font-weight:700;
    background:#fff;border:1.5px solid var(--ink);
    padding:8px 12px;cursor:pointer;
  }
  .btn2:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
  .btn2:active{transform:none;box-shadow:none}
  .btn2:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media(max-width:700px){
    .footer{grid-template-columns:1fr}
  }
  @media print{
    .sub-nav, .footer-actions{display:none}
    body{background:#fff}
    body::before{display:none}
    .today-sheet, .day-card{box-shadow:none;break-inside:avoid}
  }
  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="masthead-left">
      <div class="title-row">
        <h1>Расписание <em>на неделю</em></h1>
      </div>
    </div>
    <div class="masthead-right">
      <div class="time-badge" id="dateBadge" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="date" id="badgeDate">—</span>
        <span class="time" id="badgeTime">—</span>
      </div>

    </div>
  </header>

  <main class="layout">
    <section class="today-sheet" id="todaySheet" aria-labelledby="todayHeading">
      <div class="sheet-head">
        <div class="sheet-head-left">
          <div class="sheet-day" id="todayHeading">Сегодня — <span>...</span></div>
          <span class="sheet-badge" id="todayBadge">сегодня</span>
        </div>
        <div class="sheet-count" id="todayCount"><b>—</b> уроков</div>
      </div>
      <div class="sheet-body">
        <div class="lessons-today" id="todayList"></div>
        <div id="todayEmpty" style="display:none;font-size:13px;color:var(--muted);padding:8px 0;font-family:'JetBrains Mono',monospace">Сегодня без уроков — выходные. Листай остальные дни →</div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">
          <span id="todaySub" style="color:var(--ink-2);font-weight:500">—</span>
        </div>
      </div>
    </section>

    <aside class="stack" aria-label="Остальные дни">
      <div class="stack-label">Остальная неделя</div>
      <div id="stackGrid" style="display:flex;flex-direction:column;gap:12px"></div>
    </aside>
  </main>

  <footer class="footer">
    <div class="next-line">
      <span class="next-kicker">завтра</span>
      <span id="tomorrowText">—</span>
    </div>
    <div class="footer-actions">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);align-self:center">Собрать рюкзак по списку — отметь галочкой в тетради</span>
    </div>
  </footer>
</div>

<script>
const schedule = [
  { id:1, day:'Понедельник', lessons:[
    {name:'Разговоры о важном', icon:'💬', dot:'dot-razgovor'},
    {name:'Русский язык', icon:'📝', dot:'dot-rus'},
    {name:'Математика', icon:'🔢', dot:'dot-math'},
    {name:'Иностранный язык', icon:'🌍', dot:'dot-eng'},
    {name:'Чтение', icon:'📖', dot:'dot-read'},
    {name:'Логопед', icon:'🗣️', dot:'dot-logo'},
  ]},
  { id:2, day:'Вторник', lessons:[
    {name:'Музыка', icon:'🎵', dot:'dot-music'},
    {name:'Русский язык', icon:'📝', dot:'dot-rus'},
    {name:'Чтение', icon:'📖', dot:'dot-read'},
    {name:'Математика', icon:'🔢', dot:'dot-math'},
    {name:'Дефектолог', icon:'🧩', dot:'dot-def'},
  ]},
  { id:3, day:'Среда', lessons:[
    {name:'Русский язык', icon:'📝', dot:'dot-rus'},
    {name:'Математика', icon:'🔢', dot:'dot-math'},
    {name:'Физкультура', icon:'🏃', dot:'dot-fiz'},
    {name:'Окружающий мир', icon:'🌿', dot:'dot-okm'},
    {name:'ИЗО', icon:'🎨', dot:'dot-izo'},
    {name:'Логопед', icon:'🗣️', dot:'dot-logo'},
  ]},
  { id:4, day:'Четверг', lessons:[
    {name:'Математика', icon:'🔢', dot:'dot-math'},
    {name:'Русский язык', icon:'📝', dot:'dot-rus'},
    {name:'Иностранный язык', icon:'🌍', dot:'dot-eng'},
    {name:'Чтение', icon:'📖', dot:'dot-read'},
    {name:'Труд', sub:'психолог', icon:'🔨', dot:'dot-trud'},
  ]},
  { id:5, day:'Пятница', lessons:[
    {name:'Русский язык', icon:'📝', dot:'dot-rus'},
    {name:'Математика', icon:'🔢', dot:'dot-math'},
    {name:'Чтение', icon:'📖', dot:'dot-read'},
    {name:'Физкультура', icon:'🏃', dot:'dot-fiz'},
    {name:'Окружающий мир', icon:'🌿', dot:'dot-okm'},
  ]},
];

function getTodayId(){
  const d = new Date().getDay();
  return d>=1 && d<=5 ? d : null;
}

function render(){
  const now = new Date();
  const jsDay = now.getDay();
  const todayId = jsDay>=1 && jsDay<=5 ? jsDay : null;
  const isWeekend = jsDay===0 || jsDay===6;
  const nowMin = now.getHours()*60 + now.getMinutes();

  const heading = document.getElementById('todayHeading');
  const badge = document.getElementById('todayBadge');
  const count = document.getElementById('todayCount');
  const list = document.getElementById('todayList');
  const empty = document.getElementById('todayEmpty');
  const sub = document.getElementById('todaySub');

  function lessonRange(i){ return {s:(8+i)*60+30, e:(9+i)*60+15}; }
  function dayLastEnd(day){ return (9 + (day.lessons.length-1))*60 + 15; }

  let active = null;
  let highlightIdx = -1;
  let isTomorrowView = false;
  let activeBadge = 'сегодня';
  let headingPrefix = 'Сегодня —';

  // определяем активный лист
  if(isWeekend){
    active = null;
  } else if(todayId){
    const today = schedule.find(s=>s.id===todayId);
    const lastEnd = dayLastEnd(today);
    if(nowMin > lastEnd){
      const tomorrowId = todayId + 1;
      if(tomorrowId <= 5){
        active = schedule.find(s=>s.id===tomorrowId);
        isTomorrowView = true;
        activeBadge = 'завтра';
        headingPrefix = 'Завтра —';
        highlightIdx = -1;
      } else {
        // пятница вечер -> выходные
        active = null;
      }
    } else {
      active = today;
      for(let i=0;i<active.lessons.length;i++){
        const {s,e} = lessonRange(i);
        if(nowMin >= s && nowMin < e){ highlightIdx = i; break; }
      }
    }
  }

  if(active){
    heading.innerHTML = `${headingPrefix} <span>${active.day.toLowerCase()}</span>`;
    badge.textContent = activeBadge;
    badge.style.display='inline-block';
    count.innerHTML = `<b>${active.lessons.length}</b> уроков`;
    list.style.display='flex';
    empty.style.display='none';
    list.innerHTML = active.lessons.map((l,i)=>`
      <div class="lesson-row ${i===highlightIdx ? 'is-highlight' : ''}">
        <div class="lnum">${i+1}</div>
        <div class="licon">${l.icon}</div>
        <div class="lesson-name2">${l.name}${l.sub?` <small>(${l.sub})</small>`:''} <span class="mini-dot ${l.dot}"></span></div>
        <div class="lesson-room">${8+i}:30 — ${9+i}:15</div>
      </div>
    `).join('');
    sub.textContent = active.lessons.map(l=>l.name).join(' / ');
  } else if(isWeekend || (todayId===5 && nowMin > dayLastEnd(schedule.find(s=>s.id===5)))){
    heading.innerHTML = `Выходные — <span>отдыхаем</span>`;
    badge.textContent = 'выходные';
    badge.style.display='inline-block';
    count.innerHTML = `<b>0</b> уроков`;
    list.style.display='none';
    empty.style.display='block';
    empty.textContent = `В понедельник: ${schedule[0].lessons.map(l=>l.name).join(' / ')} — собери форму и сменку`;
    sub.textContent = 'понедельник стартует в 8:30';
  } else {
    heading.innerHTML = `Расписание — <span>неделя</span>`;
    badge.style.display='none';
    count.innerHTML = `<b>26</b> уроков`;
    list.style.display='none';
    empty.style.display='block';
    sub.textContent = 'выбери день справа';
  }

  // stack - остальные дни (исключая активный)
  const stack = document.getElementById('stackGrid');
  let others;
  if(active) others = schedule.filter(s=>s.id!==active.id);
  else if(isWeekend) others = schedule;
  else others = schedule.filter(s=>s.id!==todayId);
  stack.innerHTML = others.map(d=>{
    return `<div class="day-card" id="day-${d.id}">
      <div class="day-card-head">
        <div class="day-card-title">${d.day}</div>
        <div class="day-card-count">${d.lessons.length} уроков</div>
      </div>
      <div class="mini-list">
        ${d.lessons.map((l,i)=>`
          <div class="mini-item">
            <span class="mini-num">${i+1}</span>
            <span class="mini-icon">${l.icon}</span>
            <span>${l.name}${l.sub?` <span style="color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px">(${l.sub})</span>`:''} <span class="mini-dot ${l.dot}"></span></span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');

  // завтра - подпись внизу
  const tomorrowEl = document.getElementById('tomorrowText');
  if(isTomorrowView && active){
    const after = schedule.find(s=>s.id===active.id+1);
    tomorrowEl.innerHTML = after ? `<b>${after.day}:</b> ${after.lessons.map(l=>l.name).join(', ')}` : '<b>Выходные</b> — можно выдохнуть';
  } else if(active && !isWeekend){
    const nextId = active.id + 1;
    const tom = schedule.find(s=>s.id===nextId);
    if(isTomorrowView) { /* already handled */ }
    else tomorrowEl.innerHTML = tom ? `<b>${tom.day}:</b> ${tom.lessons.map(l=>l.name).join(', ')}` : '<b>Выходные</b> — можно выдохнуть';
  } else if(todayId){
    const tom = schedule.find(s=>s.id===todayId+1);
    tomorrowEl.innerHTML = tom ? `<b>${tom.day}:</b> ${tom.lessons.map(l=>l.name).join(', ')}` : '<b>Выходные</b> — можно выдохнуть';
  } else if(isWeekend){
    tomorrowEl.innerHTML = `<b>Понедельник:</b> ${schedule[0].lessons.map(l=>l.name).join(', ')}`;
  } else {
    tomorrowEl.textContent = '—';
  }
}

function tick(){
  const now = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long'};
  document.getElementById('badgeDate').textContent = now.toLocaleDateString('ru-RU', opts);
  document.getElementById('badgeTime').textContent = now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}
render();
tick();
setInterval(()=>{ tick(); render(); }, 30000);
</script>
</body>
